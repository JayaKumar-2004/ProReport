<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page 1</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
        }
        .page {
            width: 210mm; /* A4 size width */
            height: 297mm; /* A4 size height */
            background: white;
            border: 2px solid #000;
            position: relative;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .page-number {
            position: absolute;
            bottom: 20px;
            left: 20px;
            font-family: sans-serif;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="page">
        <div class="page-number">Page 1 of 47</div>
    </div>
</body>
</html>
